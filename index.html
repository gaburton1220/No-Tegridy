<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No-Tegridy Fantasy Football</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1e1e1e, #343a40);
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-top: 20px;
            color: #f0ad4e;
        }
        h2 {
            font-size: 2rem;
            margin: 20px 0;
            color: #5bc0de;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .twitch-embed {
            margin: 20px auto;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .gallery img {
            border: 5px solid #f0ad4e;
            border-radius: 10px;
            width: 300px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            background: #212529;
            color: #868e96;
        }
    </style>
</head>
<body>
    <h1>No-Tegridy Fantasy Football</h1>
    <p>The one-stop shop for all your league's chaos, trash talk, and highlights!</p>

    <h2>🔥 Live Twitch Stream 🔥</h2>
    <div class="twitch-embed">
        <iframe
            src="https://player.twitch.tv/?channel=notegridy69&parent=no-tegridy.org"
            height="480"
            width="854"
            allowfullscreen>
        </iframe>
    </div>

    <h2>🎨 League Gallery 🎨</h2>
    <div class="gallery">
        <img src="IMG_0822.jpeg" alt="League Photo 1">
        <img src="IMG_0839.jpeg" alt="League Photo 2">
        <img src="IMG_4826.gif" alt="League GIF">
    </div>

    <footer>
        <p>Copyright &copy; 2024 No-Tegridy Fantasy Football | Powered by Trash Talk and Good Vibes</p>
    </footer>
</body>
</html>
